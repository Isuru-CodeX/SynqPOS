<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gemini signature cosmic gradient -->
    <linearGradient id="gemini-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#4F46E5" />
      <stop offset="70%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Gemini glowing orb gradient -->
    <radialGradient id="gemini-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Background card gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for subtle outer glow -->
    <filter id="sparkle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg-grad)" />
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#gemini-glow)" />
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="url(#border-grad)" stroke-width="3" />

  <!-- Orbiting Synq Ring (Connecting POS & Cloud) -->
  <path d="M 120 256 C 120 180, 200 130, 280 145 C 330 155, 375 190, 390 240" 
        fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 12" opacity="0.4" />
  <path d="M 392 256 C 392 332, 312 382, 232 367 C 182 357, 137 322, 122 272" 
        fill="none" stroke="#EC4899" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 12" opacity="0.4" />

  <!-- Main Gemini 4-Point Sparkle Star -->
  <g filter="url(#sparkle-glow)">
    <path d="M 256 90
             C 256 180, 290 220, 420 256
             C 290 292, 256 332, 256 422
             C 256 332, 222 292, 92 256
             C 222 220, 256 180, 256 90 Z"
          fill="url(#gemini-grad)" />
  </g>

  <!-- Core Radiant Star Center (Pure Brilliance) -->
  <circle cx="256" cy="256" r="26" fill="#FFFFFF" opacity="0.9" />

  <!-- Secondary Companion Sparkle (Synq Pulse - Gemini style satellite) -->
  <g transform="translate(110, -110)">
    <path d="M 256 190
             C 256 225, 270 240, 320 256
             C 270 272, 256 287, 256 322
             C 256 287, 242 272, 192 256
             C 242 240, 256 225, 256 190 Z"
          fill="#38BDF8" opacity="0.95" filter="url(#sparkle-glow)" />
    <circle cx="256" cy="256" r="10" fill="#FFFFFF" />
  </g>

  <!-- Subtle Micro-sparkle bottom left -->
  <g transform="translate(-105, 105) scale(0.65)">
    <path d="M 256 200
             C 256 228, 268 240, 310 256
             C 268 272, 256 284, 256 312
             C 256 284, 244 272, 202 256
             C 244 240, 256 228, 256 200 Z"
          fill="#EC4899" opacity="0.9" />
  </g>
</svg>
