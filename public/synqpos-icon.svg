<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gemini signature cosmic gradient: Cyan -> Indigo -> Purple -> Pink -->
    <linearGradient id="gemini-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#8B5CF6" />
      <stop offset="78%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glowing orb radial gradient -->
    <radialGradient id="gemini-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#EC4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>

    <!-- Background card gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#151028" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for subtle outer glow -->
    <filter id="sparkle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg-grad)" />
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#gemini-glow)" />
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="url(#border-grad)" stroke-width="4" />

  <!-- Orbiting Synq Ring (Cyan top, Pink bottom) -->
  <path d="M 120 256 C 120 180, 200 130, 280 145 C 330 155, 375 190, 390 240" 
        fill="none" stroke="#06B6D4" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 12" opacity="0.8" />
  <path d="M 392 256 C 392 332, 312 382, 232 367 C 182 357, 137 322, 122 272" 
        fill="none" stroke="#EC4899" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 12" opacity="0.8" />

  <!-- Main Gemini 4-Point Sparkle Star -->
  <g filter="url(#sparkle-glow)">
    <path d="M 256 75
             C 256 180, 290 220, 430 256
             C 290 292, 256 332, 256 437
             C 256 332, 222 292, 82 256
             C 222 220, 256 180, 256 75 Z"
          fill="url(#gemini-grad)" />
  </g>

  <!-- Core Radiant Star Center (Pure Brilliance) -->
  <circle cx="256" cy="256" r="30" fill="#FFFFFF" opacity="0.95" />

  <!-- Secondary Companion Sparkle (Electric Cyan) -->
  <g transform="translate(115, -115)">
    <path d="M 256 180
             C 256 225, 270 240, 325 256
             C 270 272, 256 287, 256 332
             C 256 287, 242 272, 187 256
             C 242 240, 256 225, 256 180 Z"
          fill="#06B6D4" opacity="0.95" filter="url(#sparkle-glow)" />
    <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
  </g>

  <!-- Bottom Left Companion Sparkle (Neon Pink) -->
  <g transform="translate(-105, 105) scale(0.72)">
    <path d="M 256 185
             C 256 226, 268 240, 315 256
             C 268 272, 256 286, 256 327
             C 256 286, 244 272, 197 256
             C 244 240, 256 226, 256 185 Z"
          fill="#EC4899" opacity="0.95" filter="url(#sparkle-glow)" />
    <circle cx="256" cy="256" r="13" fill="#FFFFFF" />
  </g>
</svg>
